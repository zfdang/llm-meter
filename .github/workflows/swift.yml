name: Swift
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Build and test
        run: swift test --arch arm64
      - name: Package app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LLM-Meter-arm64
          path: build/LLM-Meter-arm64.zip
